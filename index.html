<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>URE SOROCABA - Controle de Empréstimos de Equipamentos</title>
 <!-- Font Awesome Icons -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
 <!-- Folhas de Estilos -->
 <link rel="icon" type="image/png" href="img/logo_ure.png">
  <link rel="stylesheet" href="css/styles.css">
 <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <!-- TELA DE LOGIN DO SISTEMA -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo-wrap">
          <img src="img/logo_ure.png" alt="Logo URE Sorocaba" class="login-logo">
        </div>
        <h1 class="login-title">URE SOROCABA</h1>
        <p class="login-subtitle">Controle de Empréstimos de Equipamentos</p>
      </div>

      <form id="formLogin" class="login-form" onsubmit="event.preventDefault(); App.handleLogin(event); return false;" autocomplete="off">
        <div class="login-error-msg" id="loginErrorMsg" style="display: none;">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span id="loginErrorText">Usuário ou senha incorretos.</span>
        </div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label" for="loginUsername">Usuário ou E-mail</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="loginUsername" class="form-input" placeholder="Digite seu usuário ou e-mail" required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); App.handleLogin(event); return false; }">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label class="form-label" for="loginPassword">Senha de Acesso</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="loginPassword" class="form-input" placeholder="Digite sua senha" required autocomplete="new-password" data-lpignore="true" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); App.handleLogin(event); return false; }">
            <button type="button" class="btn-toggle-pwd" id="btnTogglePwd" onclick="App.togglePasswordVisibility()" title="Mostrar/ocultar senha">
              <i class="fa-regular fa-eye" id="iconTogglePwd"></i>
            </button>
          </div>
        </div>

        <button type="button" class="btn-login-submit" id="btnLoginSubmit" onclick="App.handleLogin(event)">
          <span id="btnLoginText"><i class="fa-solid fa-right-to-bracket"></i> Acessar Sistema</span>
          <span id="btnLoginSpinner" style="display: none;"><i class="fa-solid fa-circle-notch fa-spin"></i> Entrando...</span>
        </button>

        <div class="login-footer-info">
          <i class="fa-solid fa-shield-halved"></i> Autenticação Segura • Firebase Cloud
        </div>
      </form>
    </div>
  </div>


 <!-- Cabeçalho Superior -->
 <header class="app-header">
 <div class="header-left">
 <button class="menu-toggle" id="menuToggle" title="Recolher / Expandir Menu">
 <i class="fa-solid fa-bars"></i>
 </button>
 <div class="brand-info">
        <img src="img/logo_ure.png" alt="Logo URE Sorocaba" class="header-logo">
        <div class="brand-text">
          <div class="brand-title">URE SOROCABA</div>
          <div class="brand-subtitle">Controle de Empréstimos de Equipamentos</div>
        </div>
      </div>
 </div>

   <div class="header-right">
    <div class="system-clock" id="systemClock">
      <i class="fa-regular fa-clock"></i> Carregando...
    </div>
        <div class="user-menu-wrapper" id="headerUserProfile" style="display: none;">
      <button type="button" class="user-avatar-btn" id="btnUserMenu" onclick="App.toggleUserDropdown(event)" title="Minha Conta">
        <span id="headerUserInitial">U</span>
      </button>
      <div class="user-dropdown-menu" id="userDropdownMenu" style="display: none;">
        <div class="user-dropdown-header">
          <div class="user-dropdown-avatar" id="dropdownUserInitial">U</div>
          <div class="user-dropdown-info">
            <span class="user-dropdown-name" id="headerUserName">Usuário</span>
          </div>
        </div>
        <div class="user-dropdown-divider"></div>
        <button type="button" class="user-dropdown-logout" onclick="App.logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>
